    <text x="72" y="216" font-size="13" fill="#546A7B">
      <tspan fill="#00E5FF" font-weight="bold">82 H/s</tspan>  ·  rockyou.txt  ·  4/12 workers  ·  ETA 1.2 min
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;.8;.82" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="72" y="216" font-size="13" fill="#7CFF6B" opacity="0">cracked in <tspan font-weight="bold">00:07.4</tspan>  ·  5,884 candidates  ·  792 H/s peak
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.8;.82;.97;1" dur="9s" repeatCount="indefinite"/>
    </text>

