    <g fill="#00E5FF">
      <rect x="72"  y="248" width="22" height="18"><animate attributeName="height" values="18;34;10;26;40;18" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="104" y="238" width="22" height="28"><animate attributeName="height" values="28;12;38;20;30;28" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="136" y="252" width="22" height="14"><animate attributeName="height" values="14;36;18;42;12;14" dur="1.8s" repeatCount="indefinite"/></rect>
      <rect x="168" y="230" width="22" height="36"><animate attributeName="height" values="36;16;30;44;22;36" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="200" y="244" width="22" height="22"><animate attributeName="height" values="22;40;14;28;36;22" dur="1.7s" repeatCount="indefinite"/></rect>
      <rect x="232" y="236" width="22" height="30"><animate attributeName="height" values="30;10;32;18;40;30" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="264" y="250" width="22" height="16"><animate attributeName="height" values="16;34;20;42;14;16" dur="1.9s" repeatCount="indefinite"/></rect>
      <rect x="296" y="228" width="22" height="38"><animate attributeName="height" values="38;18;28;12;44;38" dur="1.6s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="#39F0A5">
      <rect x="344" y="240" width="22" height="26"><animate attributeName="height" values="26;42;16;30;10;26" dur="1.5s" begin=".2s" repeatCount="indefinite"/></rect>
      <rect x="376" y="252" width="22" height="14"><animate attributeName="height" values="14;30;38;18;40;14" dur="1.8s" begin=".1s" repeatCount="indefinite"/></rect>
      <rect x="408" y="232" width="22" height="34"><animate attributeName="height" values="34;14;26;40;20;34" dur="1.4s" begin=".3s" repeatCount="indefinite"/></rect>
      <rect x="440" y="246" width="22" height="20"><animate attributeName="height" values="20;36;12;30;42;20" dur="1.7s" begin=".2s" repeatCount="indefinite"/></rect>
      <rect x="472" y="238" width="22" height="28"><animate attributeName="height" values="28;10;34;16;38;28" dur="1.6s" begin=".4s" repeatCount="indefinite"/></rect>
      <rect x="504" y="254" width="22" height="12"><animate attributeName="height" values="12;32;18;40;22;12" dur="1.3s" begin=".1s" repeatCount="indefinite"/></rect>
      <rect x="536" y="234" width="22" height="32"><animate attributeName="height" values="32;14;28;42;18;32" dur="1.9s" begin=".3s" repeatCount="indefinite"/></rect>
      <rect x="568" y="248" width="22" height="18"><animate attributeName="height" values="18;36;10;28;40;18" dur="1.5s" begin=".2s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="#7CFF6B">
      <rect x="616" y="242" width="22" height="24"><animate attributeName="height" values="24;40;14;32;12;24" dur="1.6s" begin=".1s" repeatCount="indefinite"/></rect>
      <rect x="648" y="252" width="22" height="14"><animate attributeName="height" values="14;34;20;42;16;14" dur="1.4s" begin=".3s" repeatCount="indefinite"/></rect>
      <rect x="680" y="230" width="22" height="36"><animate attributeName="height" values="36;16;30;44;20;36" dur="1.8s" begin=".2s" repeatCount="indefinite"/></rect>
      <rect x="712" y="244" width="22" height="22"><animate attributeName="height" values="22;38;12;30;40;22" dur="1.5s" begin=".4s" repeatCount="indefinite"/></rect>
      <rect x="744" y="236" width="22" height="30"><animate attributeName="height" values="30;12;32;18;42;30" dur="1.7s" begin=".1s" repeatCount="indefinite"/></rect>
      <rect x="776" y="248" width="22" height="18"><animate attributeName="height" values="18;36;14;40;22;18" dur="1.4s" begin=".3s" repeatCount="indefinite"/></rect>
    </g>

    <!-- ===== bottom terminal lines ===== -->
    <g font-size="13.5">
      <text x="50" y="330" fill="#00E5FF">❯ <tspan fill="#E6EDF3">hashcrack</tspan> <tspan fill="#8B98A5">-H</tspan> <tspan fill="#FFD866">a51b0…</tspan> <tspan fill="#8B98A5">-w</tspan> <tspan fill="#C9D6E3">rockyou.txt</tspan> <tspan fill="#8B98A5">-r</tspan></text>
      <text x="50" y="360" fill="#546A7B">6 attack modes · encrypted ZIP · all cores · zero deps
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- typing cursor -->
    <rect x="596" y="320" width="8" height="15" fill="#7CFF6B">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- subtle sweep line -->
    <rect y="0" width="90" height="420" fill="url(#fade)" opacity="0.06">
      <animate attributeName="x" values="-90;880" dur="7s" repeatCount="indefinite"/>
    </rect>
