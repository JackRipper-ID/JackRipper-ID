<svg width="880" height="420" viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular, Consolas, Menlo, monospace">
  <defs>
    <clipPath id="frame"><rect width="880" height="420" rx="14"/></clipPath>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#7CFF6B"/>
    </linearGradient>
    <linearGradient id="barfill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/><stop offset=".5" stop-color="#39F0A5"/><stop offset="1" stop-color="#7CFF6B"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070B10"/><stop offset="1" stop-color="#070B10" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="880" height="420" fill="#070B10"/>

    <!-- ===== faint matrix rain ===== -->
    <g fill="#0F3D2E" font-size="13" opacity="0.55">
      <text x="20"  y="-20">01101<span fill="#155C43">$$</span>10A01<span fill="#1A7A57">#</span>F0110</text>
      <text x="130" y="-60">A1F<span fill="#155C43">0</span>11#0<span fill="#1A7A57">1</span>A01F0<span fill="#155C43">$</span>1011</text>
      <text x="250" y="-10">1#0A<span fill="#155C43">F</span>0110<span fill="#1A7A57">1</span>0F1A0<span fill="#155C43">1</span>#F01</text>
      <text x="370" y="-70">F01<span fill="#155C43">1</span>A0#<span fill="#1A7A57">0</span>11F0A0<span fill="#155C43">1</span>01FA#</text>
      <text x="490" y="-30">0F1A<span fill="#155C43">#</span>1101<span fill="#1A7A57">$</span>F011A<span fill="#155C43">0</span>1#F0</text>
      <text x="610" y="-55">10A<span fill="#155C43">1</span>F0#<span fill="#1A7A57">1</span>0110FA<span fill="#155C43">0</span>#F011</text>
      <text x="730" y="-15">A01F<span fill="#155C43">0</span>#11<span fill="#1A7A57">$</span>0FA11<span fill="#155C43">0</span>1F#0A</text>
      <text x="840" y="-45">1F0<span fill="#155C43">A</span>1#0<span fill="#1A7A57">F</span>01A0<span fill="#155C43">1</span>#F011</text>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 480" dur="9s" repeatCount="indefinite"/>
    </g>

    <!-- ===== window ===== -->
    <rect x="24" y="20" width="832" height="380" rx="10" fill="#0B1017" stroke="#152230"/>
    <rect x="24" y="20" width="832" height="30" rx="10" fill="#101824"/>
    <circle cx="44"  cy="35" r="5" fill="#FF5F56"/>
    <circle cx="63"  cy="35" r="5" fill="#FFBD2E"/>
    <circle cx="82"  cy="35" r="5" fill="#27C93F"/>
    <text x="440" y="39" fill="#546A7B" font-size="11.5" text-anchor="middle">hashcrack — termux</text>
    <line x1="24" y1="50" x2="856" y2="50" stroke="url(#acc)" opacity="0.5"/>

    <!-- ===== ascii title ===== -->
    <g fill="#00E5FF" font-size="17" xml:space="preserve">
      <text x="50" y="95" opacity="0.95">▚▞ HACKCRACK CORE v2.1 <tspan fill="#3D4F5D">·</tspan> <tspan fill="#7CFF6B">39+ formats</tspan> <tspan fill="#3D4F5D">·</tspan> <tspan fill="#FFD866">CPU-only</tspan></text>
    </g>

    <!-- ===== panel box ===== -->
    <rect x="50" y="115" width="780" height="180" rx="8" fill="#0D1420" stroke="#1B2A3B"/>

    <!-- spinner (braille, 8 frames) -->
